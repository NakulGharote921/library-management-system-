services:
  - type: web
    name: library-management-backend
    runtime: docker
    plan: free
    rootDir: library-Backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Add these in the Render dashboard (secrets must not live in this file):
      #   SPRING_DATASOURCE_URL      e.g. jdbc:mysql://<host>:<port>/railway?zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=UTC&useSSL=false
      #   SPRING_DATASOURCE_USERNAME
      #   SPRING_DATASOURCE_PASSWORD
      #   JWT_SECRET                 min 32 characters
      #   JWT_EXPIRATION             optional, default 86400000 (24h)
      #   FRONTEND_URL               e.g. https://your-app.vercel.app  (must be the EXACT live Vercel origin)
      #   CORS_ALLOWED_ORIGINS       optional; comma-separated override for the CORS allow-list
      #   RAZORPAY_KEY_ID            optional unless payments are used
      #   RAZORPAY_KEY_SECRET        optional unless payments are used
      #   GOOGLE_CLIENT_ID           optional (disables Google OAuth when unset)
      #   GOOGLE_CLIENT_SECRET       optional
