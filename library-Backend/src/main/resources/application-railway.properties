# Railway deployment — activate with SPRING_PROFILES_ACTIVE=railway (or -Dspring.profiles.active=railway)
# Datasource is wired to the referenced Railway MySQL service (auto-injected MYSQL_* variables).
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always

# Server
server.port=${PORT:8081}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/javascript

# Actuator (healthcheck)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# CORS + OAuth endpoints for the deployed frontend
app.cors.allowed-origin-patterns=${FRONTEND_URL:http://localhost:3000},https://*.up.railway.app
spring.security.oauth2.client.registration.google.redirect-uri=${APP_BASE_URL:http://localhost:8081}/login/oauth2/code/google
app.oauth.frontend-redirect-uri=${FRONTEND_URL:http://localhost:3000}/oauth/callback

# JWT is inherited from application.properties (override here via env vars if desired).
# jwt.secret=${JWT_SECRET:}