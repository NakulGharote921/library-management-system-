# Production (Render + Railway MySQL) profile — all values injected via environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# HikariCP pool tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Server
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/javascript
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=None
server.error.include-message=never
server.error.include-stacktrace=never

# Actuator (Render health check)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Cashfree Payments
cashfree.app-id=${CASHFREE_APP_ID}
cashfree.secret-key=${CASHFREE_SECRET_KEY}
cashfree.environment=${CASHFREE_ENVIRONMENT:sandbox}
cashfree.api-version=${CASHFREE_API_VERSION:2026-01-01}
app.payments.notify-url=${CASHFREE_NOTIFY_URL:}

# Google OAuth2 Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${APP_BASE_URL}/login/oauth2/code/google
app.oauth.frontend-redirect-uri=${FRONTEND_URL}/oauth/callback

# CORS (comma-separated list supported; wildcard covers any Vercel URL of this project)
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:3000},https://library-management-system-jqbm*.vercel.app}
