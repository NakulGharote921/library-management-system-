# ============================================================
# Library Management System — Backend Configuration
# Production values are injected via Render environment variables.
# Local development fallbacks are provided with ${VAR:default}.
# ============================================================

# --- Server ---
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,text/javascript
server.error.include-message=never
server.error.include-stacktrace=never

# --- Database (Railway MySQL in production) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_dbg?zeroDateTimeBehavior=CONVERT_TO_NULL&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# HikariCP pool tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# --- JWT (REQUIRED in production: JWT_SECRET, min 32 chars) ---
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# --- File Upload ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Fine & Payments (REQUIRED in production: RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET) ---
fine.rate-per-day=5
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# --- Email Notifications (leave SMTP_USERNAME blank to disable email and log only) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=noreply@lumina-library.dev

# --- Google OAuth2 Login (optional; enabled only when GOOGLE_CLIENT_ID env var is set) ---
app.oauth.frontend-redirect-uri=${FRONTEND_URL:http://localhost:3000}/oauth/callback

# --- CORS (allow the deployed frontend; comma-separated list supported) ---
# CORS_ALLOWED_ORIGINS overrides everything. By default: FRONTEND_URL plus any
# Vercel deployment URL of this project (so the backend keeps working even if
# the Vercel project URL changes, e.g. ...-jqbm-p9iivn7io.vercel.app).
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:3000},https://library-management-system-jqbm*.vercel.app}

# --- Actuator (Render health checks) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Logging (production: INFO, no SQL debug) ---
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF
